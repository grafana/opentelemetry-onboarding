name: Check generated examples

on:
  pull_request:
    paths:
      - 'kubernetes/otel-kube-stack-helm-chart/values.yaml'
      - 'kubernetes/otel-kube-stack-helm-chart/examples/**/values.yaml'
      - 'kubernetes/otel-kube-stack-helm-chart/Makefile'

jobs:
  check-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0

      - name: Add Helm repo
        run: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts

      - name: Generate examples
        run: make generate-examples
        working-directory: kubernetes/otel-kube-stack-helm-chart

      - name: Check for diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Rendered examples are out of date. Run 'make generate-examples' and commit the result."
            exit 1
          fi
