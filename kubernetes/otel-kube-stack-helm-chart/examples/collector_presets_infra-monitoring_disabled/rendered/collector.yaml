---
# Source: opentelemetry-kube-stack/templates/collector.yaml
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry-stack-daemon
  namespace: opentelemetry-operator-system
  labels:
    helm.sh/chart: opentelemetry-kube-stack-0.13.1
    app.kubernetes.io/version: "0.141.0"
    app.kubernetes.io/managed-by: Helm
    release: "opentelemetry-stack"        
spec:
  managementState: managed
  mode: daemonset
  config:
    connectors:
      grafanacloud/connector:
        host_identifiers:
        - host.id
        - k8s.node.uid
        - k8s.node.name
    exporters:
      debug: {}
      otlphttp/grafana_cloud:
        auth:
          authenticator: basicauth/grafana_cloud
        endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    extensions:
      basicauth/grafana_cloud:
        client_auth:
          password: ${env:GRAFANA_CLOUD_API_KEY}
          username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      file_storage:
        directory: /var/lib/otelcol
      k8s_observer:
        auth_type: serviceAccount
        node: ${env:K8S_NODE_NAME}
    processors:
      batch:
        send_batch_max_size: 1500
        send_batch_size: 1000
        timeout: 1s
      k8sattributes:
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/instance
            tag_name: k8s.app.instance
          - from: pod
            key: app.kubernetes.io/component
            tag_name: k8s.app.component
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.pod.start_time
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.replicaset.uid
          - k8s.daemonset.name
          - k8s.daemonset.uid
          - k8s.job.name
          - k8s.job.uid
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.statefulset.name
          - k8s.statefulset.uid
          - container.image.tag
          - container.image.name
          - k8s.cluster.uid
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          otel_annotations: true
        filter:
          node_from_env_var: OTEL_K8S_NODE_NAME
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
          - from: resource_attribute
            name: k8s.node.name
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
        - sources:
          - from: connection
      resource/hostname:
        attributes:
        - action: insert
          from_attribute: k8s.node.name
          key: host.name
      resourcedetection/env:
        detectors:
        - env
        - k8snode
        override: false
        timeout: 2s
    receivers:
      filelog:
        exclude: []
        include:
        - /var/log/pods/*/*/*.log
        include_file_name: false
        include_file_path: true
        operators:
        - id: container-parser
          max_log_size: 102400
          type: container
        retry_on_failure:
          enabled: true
        start_at: end
        storage: file_storage
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      receiver_creator/metrics:
        discovery:
          enabled: true
        watch_observers:
        - k8s_observer
    service:
      extensions:
      - basicauth/grafana_cloud
      - file_storage
      - k8s_observer
      pipelines:
        logs:
          exporters:
          - otlphttp/grafana_cloud
          processors:
          - k8sattributes
          - resourcedetection/env
          - resource/hostname
          - batch
          receivers:
          - otlp
          - filelog
        metrics:
          exporters:
          - otlphttp/grafana_cloud
          processors:
          - k8sattributes
          - resourcedetection/env
          - resource/hostname
          - batch
          receivers:
          - otlp
          - grafanacloud/connector
          - receiver_creator/metrics
        traces:
          exporters:
          - otlphttp/grafana_cloud
          - grafanacloud/connector
          processors:
          - k8sattributes
          - resourcedetection/env
          - resource/hostname
          - batch
          receivers:
          - otlp
      telemetry:
        logs:
          processors:
          - batch:
              exporter:
                otlp:
                  endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}/v1/logs
                  headers:
                  - name: authorization
                    value: ${env:GRAFANA_CLOUD_BASIC_AUTH_HEADER}
                  protocol: http/protobuf
        metrics:
          readers:
          - periodic:
              exporter:
                otlp:
                  endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}/v1/metrics
                  headers:
                  - name: authorization
                    value: ${env:GRAFANA_CLOUD_BASIC_AUTH_HEADER}
                  protocol: http/protobuf
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
        resource:
          host.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
  imagePullPolicy: IfNotPresent
  upgradeStrategy: automatic
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 250Mi
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  targetAllocator:
    enabled: false
  volumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: varlibotelcol
    mountPath: /var/lib/otelcol
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: OTEL_K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: OTEL_K8S_NODE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: OTEL_K8S_NAMESPACE
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.namespace
  - name: OTEL_K8S_POD_NAME
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.name
  - name: OTEL_K8S_POD_IP
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: status.podIP
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "k8s.cluster.name=a_k8s_cluster"
  
  - name: GRAFANA_CLOUD_API_KEY
    valueFrom:
      secretKeyRef:
        key: GRAFANA_CLOUD_API_KEY
        name: grafana-cloud-auth
  - name: GRAFANA_CLOUD_BASIC_AUTH_HEADER
    valueFrom:
      secretKeyRef:
        key: GRAFANA_CLOUD_BASIC_AUTH_HEADER
        name: grafana-cloud-auth
  - name: GRAFANA_CLOUD_INSTANCE_ID
    valueFrom:
      secretKeyRef:
        key: GRAFANA_CLOUD_INSTANCE_ID
        name: grafana-cloud-auth
  - name: GRAFANA_CLOUD_OTLP_ENDPOINT
    valueFrom:
      secretKeyRef:
        key: GRAFANA_CLOUD_OTLP_ENDPOINT
        name: grafana-cloud-auth
  volumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlibotelcol
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
